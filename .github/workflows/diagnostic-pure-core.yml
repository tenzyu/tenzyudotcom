name: Diagnostic - pure Rust test closure (DO NOT MERGE)

on:
  push:
    branches: [diagnostic/verification-pure-core-20261127]

permissions:
  contents: read

jobs:
  native:
    name: Native cold - ${{ matrix.arm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, pure-core]
    env:
      ARM: ${{ matrix.arm }}
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
      NX_LOAD_DOT_ENV_FILES: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.arm == 'baseline' && '492f2005b654f005177ce351f6b521eabccc1692' || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Prepare signed native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sources=/etc/apt/sources.list.d/ubuntu.sources
          grep -q '^Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg$' "$sources"
          args=(-o "Dir::Etc::sourcelist=$sources" -o 'Dir::Etc::sourceparts=-')
          sudo apt-get "${args[@]}" update
          sudo apt-get "${args[@]}" install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config webkit2gtk-driver xvfb dbus-x11
      - run: bun install --frozen-lockfile
      - name: Verify TypeScript compatibility
        run: |
          test "$(bun x --no-install tsc --version)" = 'Version 7.0.2'
          node -e 'const ts = require("typescript"); if (typeof ts.readConfigFile !== "function" || typeof ts.createProgram !== "function") throw new Error("TypeScript compatibility API unavailable")'
      - name: Establish exact environment and dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pure-core"
          E="$RUNNER_TEMP/pure-core"
          printf '%s\n' "$ARM" > "$E/arm.txt"
          { git rev-parse HEAD HEAD^{tree}; printf '%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"; rustc -vV; cargo -V; cc --version; ld --version; pkg-config --version; dpkg-query -W -f='${binary:Package}\t${Version}\n' | LC_ALL=C sort; } > "$E/environment.txt"
          sha256sum product/apps/osu-skin-workbench/src-tauri/Cargo.lock bun.lock > "$E/locks.sha256"
          manifest=product/apps/osu-skin-workbench/src-tauri/Cargo.toml
          target=product/apps/osu-skin-workbench/src-tauri/target
          test ! -e "$target"
          features=()
          if [[ "$ARM" == pure-core ]]; then features=(--no-default-features); fi
          cargo tree --locked --manifest-path "$manifest" "${features[@]}" -e normal,build,dev --prefix none > "$E/test-graph.txt"
          cargo tree --locked --manifest-path "$manifest" -e normal,build,dev --prefix none > "$E/desktop-graph.txt"
          grep -E '^tauri v' "$E/desktop-graph.txt"
          if [[ "$ARM" == pure-core ]]; then
            if grep -E '^(tauri(-[^ ]+)?|gtk(-sys)?|webkit2gtk(-sys)?) v' "$E/test-graph.txt"; then
              echo "Desktop dependencies remain in the test closure"; exit 1
            fi
          else
            grep -E '^tauri v' "$E/test-graph.txt"
          fi
          sort -u "$E/test-graph.txt" | wc -l > "$E/test-graph-lines.txt"
      - name: Fresh IPC export and TypeScript projection
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/pure-core"
          target=product/apps/osu-skin-workbench/src-tauri/target
          manifest=product/apps/osu-skin-workbench/src-tauri/Cargo.toml
          features=()
          if [[ "$ARM" == pure-core ]]; then features=(--no-default-features); fi
          mkdir -p "$target"
          test ! -e "$target/wire.generated.ts"
          export SKIN_IPC_EXPORT="$PWD/$target/wire.generated.ts"
          /usr/bin/time -f '%e' -o "$E/ipc-export.seconds" cargo test --locked --manifest-path "$manifest" "${features[@]}" export_wire_contract 2>&1 | tee "$E/ipc-export.log"
          unset SKIN_IPC_EXPORT
          test -s "$target/wire.generated.ts"
          sha256sum "$target/wire.generated.ts" > "$E/wire.sha256"
          du -sb "$target/debug" > "$E/debug-after-export.bytes"
          bun nx run osu-skin-core:build --skip-nx-cache
          bun x tsc --ignoreConfig --noEmit --strict --skipLibCheck --moduleResolution bundler --module esnext --target es2022 product/apps/osu-skin-workbench/scripts/wire-contract-check.ts
      - name: Fresh all native obligations and distributable
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/pure-core"
          /usr/bin/time -f '%e' -o "$E/verify-release.seconds" bun nx run-many -t verify build --projects=skin-workbench --skip-nx-cache --outputStyle=stream 2>&1 | tee "$E/verify-release.log"
          git diff --exit-code -- product/apps/osu-skin-workbench/src-tauri/Cargo.lock
          target=product/apps/osu-skin-workbench/src-tauri/target
          du -sb "$target/debug" "$target/release" > "$E/target.bytes"
      - name: Fresh real native WebView and IPC
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/pure-core"
          command -v WebKitWebDriver
          dpkg-query -W webkit2gtk-driver libwebkit2gtk-4.1-0
          /usr/bin/time -f '%e' -o "$E/runtime.seconds" xvfb-run -a dbus-run-session -- python3 product/apps/osu-skin-workbench/tests/tauri-runtime.py 2>&1 | tee "$E/runtime.log"
      - name: Record exact test inventory and reject broken wire projection
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/pure-core"
          manifest=product/apps/osu-skin-workbench/src-tauri/Cargo.toml
          features=()
          if [[ "$ARM" == pure-core ]]; then features=(--no-default-features); fi
          cargo test --locked --manifest-path "$manifest" "${features[@]}" -- --list > "$E/test-list.log" 2>&1
          grep -E ': test$' "$E/test-list.log" | LC_ALL=C sort > "$E/test-names.txt"
          test "$(wc -l < "$E/test-names.txt")" -eq 25
          cat "$E/test-names.txt"
          wire=product/apps/osu-skin-workbench/src-tauri/target/wire.generated.ts
          cp "$wire" "$E/wire.generated.ts"
          printf '\nexport const ciDiagnosticBroken: number = "not-a-number";\n' >> "$wire"
          if bun x tsc --ignoreConfig --noEmit --strict --skipLibCheck --moduleResolution bundler --module esnext --target es2022 product/apps/osu-skin-workbench/scripts/wire-contract-check.ts > "$E/negative-wire.log" 2>&1; then
            echo 'Negative control unexpectedly passed'; exit 1
          fi
          grep -E 'TS2322|not assignable to type' "$E/negative-wire.log"
          cp "$E/wire.generated.ts" "$wire"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pure-core-${{ matrix.arm }}
          path: ${{ runner.temp }}/pure-core/
          if-no-files-found: error
          retention-days: 7
