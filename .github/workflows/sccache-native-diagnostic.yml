name: Native sccache dependency reuse (diagnostic only)
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: diagnostic-sccache-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  producer:
    if: github.head_ref == 'diagnostic/sccache-native-20261127'
    outputs:
      seed_digest: ${{ steps.pack.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: candidate
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
      CARGO_INCREMENTAL: '0'
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: '492f2005b654f005177ce351f6b521eabccc1692'
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Provision original Ubuntu native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config webkit2gtk-driver xvfb dbus-x11
      - run: bun install --frozen-lockfile
      - name: Verify native TypeScript 7 and legacy compiler API coexist
        run: |
          test "$(bun x --no-install tsc --version)" = 'Version 7.0.2'
          node -e 'const ts = require("typescript"); if (typeof ts.readConfigFile !== "function" || typeof ts.createProgram !== "function") throw new Error("TypeScript compatibility API unavailable")'
      - name: Capture exact environment and candidate identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sccache-evidence" "$RUNNER_TEMP/sccache-seed"
          {
            printf '%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"
            rustc -vV
            cargo -V
            cc --version
            ld --version
            pkg-config --version
            dpkg-query -W -f='${binary:Package}\t${Version}\n' | LC_ALL=C sort
          } > "$RUNNER_TEMP/sccache-evidence/environment.txt"
          sha256sum product/apps/osu-skin-workbench/src-tauri/Cargo.toml product/apps/osu-skin-workbench/src-tauri/Cargo.lock > "$RUNNER_TEMP/sccache-evidence/cargo-inputs.sha256"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/sccache-evidence/revision.txt"
          test ! -e product/apps/osu-skin-workbench/src-tauri/target
          printf 'SCCACHE_DIR=%s\nSCCACHE_EVIDENCE=%s\n' "$RUNNER_TEMP/sccache-local" "$RUNNER_TEMP/sccache-evidence" >> "$GITHUB_ENV"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.20.1
          disable_annotations: true
      - name: Configure dependency-only compiler wrapper
        run: |
          set -euo pipefail
          test -z "${SCCACHE_GHA_ENABLED:-}"
          test -x "$SCCACHE_PATH"
          install -m 0755 "$GITHUB_WORKSPACE/repo-ops/ci-diagnostic/sccache-dependencies.sh" "$RUNNER_TEMP/sccache-wrapper"
          printf 'RUSTC_WRAPPER=%s\n' "$RUNNER_TEMP/sccache-wrapper" >> "$GITHUB_ENV"
          "$SCCACHE_PATH" --version
      - name: Generate IPC contract and verify TypeScript projection
        run: |
          mkdir -p product/apps/osu-skin-workbench/src-tauri/target
          SKIN_IPC_EXPORT="$PWD/product/apps/osu-skin-workbench/src-tauri/target/wire.generated.ts" cargo test --locked --manifest-path product/apps/osu-skin-workbench/src-tauri/Cargo.toml export_wire_contract
          bun nx run osu-skin-core:build
          bun x tsc --ignoreConfig --noEmit --strict --skipLibCheck --moduleResolution bundler --module esnext --target es2022 product/apps/osu-skin-workbench/scripts/wire-contract-check.ts
      - name: Verify native product and build its distributable
        run: bun nx run-many -t verify build --projects=skin-workbench --skip-nx-cache
      - name: Record native WebKit driver version
        run: |
          command -v WebKitWebDriver
          dpkg-query -W webkit2gtk-driver libwebkit2gtk-4.1-0
      - name: Verify native WebView and real IPC with isolated skin data
        run: xvfb-run -a dbus-run-session -- python3 product/apps/osu-skin-workbench/tests/tauri-runtime.py
      - name: Record fresh outputs and native linkage
        run: |
          set -euo pipefail
          target=product/apps/osu-skin-workbench/src-tauri/target
          sha256sum "$target/wire.generated.ts" "$target/release/osu-skin-workbench" > "$RUNNER_TEMP/sccache-evidence/output.sha256"
          ldd "$target/release/osu-skin-workbench" > "$RUNNER_TEMP/sccache-evidence/linkage.txt"
          git diff --exit-code
      - name: Capture compiler cache statistics
        if: always()
        run: |
          set -euo pipefail
          "$SCCACHE_PATH" --show-stats | tee "$RUNNER_TEMP/sccache-evidence/stats.txt"
          if [[ -f "$SCCACHE_EVIDENCE/wrapper.tsv" ]]; then sort "$SCCACHE_EVIDENCE/wrapper.tsv" | uniq -c; fi
          "$SCCACHE_PATH" --stop-server
      - name: Package diagnostic compiler cache
        id: pack
        run: |
          set -euo pipefail
          test -d "$SCCACHE_DIR"
          grep -q '^registry$' "$SCCACHE_EVIDENCE/wrapper.tsv"
          grep -q '^direct$' "$SCCACHE_EVIDENCE/wrapper.tsv"
          cp "$SCCACHE_EVIDENCE/cargo-inputs.sha256" "$RUNNER_TEMP/sccache-seed/"
          cp "$SCCACHE_EVIDENCE/output.sha256" "$RUNNER_TEMP/sccache-seed/"
          /usr/bin/time -f '%e' -o "$SCCACHE_EVIDENCE/pack.seconds" tar -cf "$RUNNER_TEMP/sccache-seed/cache.tar" -C "$SCCACHE_DIR" .
          digest="$(sha256sum "$RUNNER_TEMP/sccache-seed/cache.tar" | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          du -sb "$RUNNER_TEMP/sccache-seed" > "$SCCACHE_EVIDENCE/seed-bytes.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: sccache-diagnostic-seed
          path: ${{ runner.temp }}/sccache-seed/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sccache-producer-evidence
          path: ${{ runner.temp }}/sccache-evidence/
          if-no-files-found: error
          retention-days: 7
  baseline:
