          disable_annotations: true
      - uses: actions/download-artifact@v4
        with:
          name: sccache-diagnostic-seed
          path: ${{ runner.temp }}/sccache-seed
      - name: Admit diagnostic seed from same workflow producer
        env:
          EXPECTED_DIGEST: ${{ needs.producer.outputs.seed_digest }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_DIGEST"
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$RUNNER_TEMP/sccache-seed/cache.tar" | sha256sum -c
          cmp "$SCCACHE_EVIDENCE/cargo-inputs.sha256" "$RUNNER_TEMP/sccache-seed/cargo-inputs.sha256"
          mkdir -p "$SCCACHE_DIR"
          /usr/bin/time -f '%e' -o "$SCCACHE_EVIDENCE/restore.seconds" tar -xf "$RUNNER_TEMP/sccache-seed/cache.tar" -C "$SCCACHE_DIR"
          echo 'SCCACHE_LOCAL_RW_MODE=READ_ONLY' >> "$GITHUB_ENV"
      - name: Configure dependency-only compiler wrapper
