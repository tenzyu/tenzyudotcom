  consumer:
    if: github.head_ref == 'diagnostic/sccache-native-20261127'
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: candidate
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
      CARGO_INCREMENTAL: '0'
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v5
        with:
