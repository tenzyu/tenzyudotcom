            dpkg-query -W -f='${binary:Package}\t${Version}\n' | LC_ALL=C sort
          } > "$RUNNER_TEMP/sccache-evidence/environment.txt"
          sha256sum product/apps/osu-skin-workbench/src-tauri/Cargo.toml product/apps/osu-skin-workbench/src-tauri/Cargo.lock > "$RUNNER_TEMP/sccache-evidence/cargo-inputs.sha256"
