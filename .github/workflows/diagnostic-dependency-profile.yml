# DIAGNOSTIC ONLY. Never merge this workflow.
name: Native dependency profile diagnostic
on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/diagnostic-dependency-profile.yml'
permissions:
  contents: read
jobs:
  native-cold:
    if: github.head_ref == 'diagnostic/dependency-profile-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, lean]
    env:
      CARGO_INCREMENTAL: '0'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config webkit2gtk-driver xvfb dbus-x11
      - run: bun install --frozen-lockfile
      - name: Verify native TypeScript 7 and legacy compiler API coexist
        run: |
          test "$(bun x --no-install tsc --version)" = 'Version 7.0.2'
          node -e 'const ts = require("typescript"); if (typeof ts.readConfigFile !== "function" || typeof ts.createProgram !== "function") throw new Error("TypeScript compatibility API unavailable")'
      - name: Configure isolated cold compilation and record inputs
        env:
          PROFILE_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          target=product/apps/osu-skin-workbench/src-tauri/target
          test ! -e "$target"
          test ! -e .cargo/config.toml
          test ! -e .cargo/config
          mkdir -p .cargo "$RUNNER_TEMP/profile-evidence"
          touch .cargo/config.toml
          if [[ "$PROFILE_VARIANT" == lean ]]; then
            printf '%s\n' '[profile.dev.package."*"]' 'debug = 0' '[profile.test.package."*"]' 'debug = 0' > .cargo/config.toml
          fi
          cp .cargo/config.toml "$RUNNER_TEMP/profile-evidence/profile.toml"
          {
            git rev-parse HEAD HEAD^{tree}
            printf '%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"
            rustc -vV
            cargo -V
            cc --version
            ld --version
            pkg-config --version
            dpkg-query -W -f='${binary:Package}\t${Version}\n' | LC_ALL=C sort
            sha256sum product/apps/osu-skin-workbench/src-tauri/Cargo.toml product/apps/osu-skin-workbench/src-tauri/Cargo.lock
          } > "$RUNNER_TEMP/profile-evidence/environment.txt"
          sha256sum "$RUNNER_TEMP/profile-evidence/environment.txt"
      - name: Generate IPC contract and verify TypeScript projection
        run: |
          mkdir -p product/apps/osu-skin-workbench/src-tauri/target
          SKIN_IPC_EXPORT="$PWD/product/apps/osu-skin-workbench/src-tauri/target/wire.generated.ts" cargo test --locked --manifest-path product/apps/osu-skin-workbench/src-tauri/Cargo.toml export_wire_contract
          bun nx run osu-skin-core:build
          bun x tsc --ignoreConfig --noEmit --strict --skipLibCheck --moduleResolution bundler --module esnext --target es2022 product/apps/osu-skin-workbench/scripts/wire-contract-check.ts
      - name: Verify native product and build its distributable
        run: bun nx run-many -t verify build --projects=skin-workbench --skip-nx-cache
      - name: Record native WebKit driver version
        run: |
          command -v WebKitWebDriver
          dpkg-query -W webkit2gtk-driver libwebkit2gtk-4.1-0
      - name: Verify native WebView and real IPC with isolated skin data
        run: xvfb-run -a dbus-run-session -- python3 product/apps/osu-skin-workbench/tests/tauri-runtime.py
      - name: Record output identity and uncompressed target size
        run: |
          set -euo pipefail
          target=product/apps/osu-skin-workbench/src-tauri/target
          sha256sum "$target/wire.generated.ts" "$target/release/osu-skin-workbench" | tee "$RUNNER_TEMP/profile-evidence/output.sha256"
          du -sb "$target/debug" "$target/release" | tee "$RUNNER_TEMP/profile-evidence/target-sizes.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-profile-${{ matrix.variant }}
          path: ${{ runner.temp }}/profile-evidence
          retention-days: 3
          if-no-files-found: error
