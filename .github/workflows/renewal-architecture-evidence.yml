name: Repository quality evidence

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Optional baseline commit SHA (defaults to first parent)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    if: startsWith(github.head_ref, 'evidence/') || github.head_ref == 'renewal/architecture-20261125' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NX_DAEMON: 'false'
      NX_TUI: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Prepare pinned baseline
        env:
          BASELINE: ${{ inputs.baseline || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline="${BASELINE:-$(git rev-parse HEAD^)}"
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach "$RUNNER_TEMP/baseline" "$baseline"
          mkdir -p "$RUNNER_TEMP/evidence"/{baseline,candidate}
      - name: Collect AST, owner graph, Nx project graph, task graph and history
        shell: bash
        run: |
          set -euo pipefail
          collector="$GITHUB_WORKSPACE/repo-ops/evidence/architecture-evidence.mjs"
          for label in baseline candidate; do
            if [ "$label" = baseline ]; then checkout="$RUNNER_TEMP/baseline"; else checkout="$GITHUB_WORKSPACE"; fi
            out="$RUNNER_TEMP/evidence/$label"
            (
              cd "$checkout"
              bun install --frozen-lockfile --ignore-scripts
              node "$collector" "$checkout" "$out/architecture.json" | tee "$out/summary.json"
              bun nx graph --file="$out/project-graph.json"
              bun nx run-many -t check build verify --graph="$out/task-graph.json"
              bun nx show projects --json > "$out/projects.json"
              node -e 'for (const p of JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))) console.log(p)' "$out/projects.json" | while IFS= read -r project; do
                bun nx show project "$project" --json > "$out/project-${project//\//_}.json"
              done
              cargo metadata --no-deps --format-version 1 --locked --manifest-path product/apps/osu-skin-workbench/src-tauri/Cargo.toml > "$out/cargo-metadata.json"
              { git rev-parse HEAD; node --version; bun --version; rustc --version; uname -a; } > "$out/environment.txt"
              git ls-files -z | du --files0-from=- -b --total | tail -1 > "$out/tracked-bytes.txt"
            )
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renewal-architecture-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7

  package-evidence:
    if: startsWith(github.head_ref, 'evidence/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NX_DAEMON: 'false'
      NX_TUI: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Frozen dependency install
        run: |
          mkdir -p "$RUNNER_TEMP/package-evidence"
          /usr/bin/time -v -o "$RUNNER_TEMP/package-evidence/install-time.txt" bun install --frozen-lockfile --ignore-scripts
      - name: Build browser-safe packages and workbench frontend
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/package-evidence/build-time.txt" bun nx run skin-workbench:build-vite --skip-nx-cache
      - name: Verify public export artifacts and record sizes
        run: node repo-ops/evidence/package-evidence.mjs "$RUNNER_TEMP/package-evidence/packages.json"
      - name: Record Rust dependency graph
        run: cargo tree --locked --manifest-path product/apps/osu-skin-workbench/src-tauri/Cargo.toml > "$RUNNER_TEMP/package-evidence/cargo-tree.txt"
      - name: Record registry advisory response
        run: |
          set +e
          bun audit --json > "$RUNNER_TEMP/package-evidence/bun-audit.json" 2> "$RUNNER_TEMP/package-evidence/bun-audit.stderr"
          printf '%s\n' "$?" > "$RUNNER_TEMP/package-evidence/bun-audit-exit.txt"
          cat "$RUNNER_TEMP/package-evidence/bun-audit-exit.txt"
          # Audit evidence is not an assertion that every dependency is safe.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-evidence
          path: ${{ runner.temp }}/package-evidence
          if-no-files-found: error
          retention-days: 7

  fixture-evidence:
    if: startsWith(github.head_ref, 'evidence/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NX_DAEMON: 'false'
      NX_TUI: 'false'
      NX_NO_CLOUD: 'true'
      EDITOR_BROWSER_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Set evidence destinations on runner
        run: |
          printf 'PUBLICATION_EVIDENCE_DIR=%s/publication\nPLAYWRIGHT_OUTPUT_DIR=%s/editor\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - name: Publication fixture and fault-injection evidence
        run: |
          mkdir -p "$PUBLICATION_EVIDENCE_DIR"
          /usr/bin/time -v -o "$PUBLICATION_EVIDENCE_DIR/time.txt" bun nx run web:publication-acceptance --skip-nx-cache
      - name: Editor fixture evidence
        if: always()
        run: |
          mkdir -p "$PLAYWRIGHT_OUTPUT_DIR"
          /usr/bin/time -v -o "$PLAYWRIGHT_OUTPUT_DIR/time.txt" bun run test:browser:editor
      - name: Record production static chunk sizes
        if: always()
        run: |
          if test -d product/apps/web/.next/static; then
            find product/apps/web/.next/static -type f -printf '%s %P\n' | sort -nr > "$PLAYWRIGHT_OUTPUT_DIR/static-chunks.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-evidence
          path: |
            ${{ runner.temp }}/publication/time.txt
            ${{ runner.temp }}/publication/publication-*/results.json
            ${{ runner.temp }}/publication/publication-*/next-build.log
            ${{ runner.temp }}/editor/time.txt
            ${{ runner.temp }}/editor/results.json
            ${{ runner.temp }}/editor/static-chunks.txt
            ${{ runner.temp }}/editor/next-build.log
            ${{ runner.temp }}/editor/artifacts/**/error-context.md
          if-no-files-found: error
          retention-days: 7
