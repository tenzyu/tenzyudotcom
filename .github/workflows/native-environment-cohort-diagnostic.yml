name: Native environment and historical integration identity (diagnostic only)
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: diagnostic-environment-cohort-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.head_ref == 'diagnostic/native-environment-cohort-20261127'
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, scoped]
        repeat: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Capture pre-install environment identity
        run: |
          mkdir -p "$RUNNER_TEMP/environment-evidence"
          bash repo-ops/ci-diagnostic/native-environment-evidence.sh before
      - name: Provision native dependencies
        env:
          MODE: ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$MODE" == scoped ]]; then
            sources=/etc/apt/sources.list.d/ubuntu.sources
            test -f "$sources"
            grep -q '^Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg$' "$sources"
            args=(-o "Dir::Etc::sourcelist=$sources" -o 'Dir::Etc::sourceparts=-')
          fi
          packages=(libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config webkit2gtk-driver xvfb dbus-x11)
          /usr/bin/time -f '%e' -o "$RUNNER_TEMP/environment-evidence/apt-update.seconds" sudo apt-get "${args[@]}" update
          /usr/bin/time -f '%e' -o "$RUNNER_TEMP/environment-evidence/apt-install.seconds" sudo apt-get "${args[@]}" install -y "${packages[@]}"
      - name: Capture installed environment identity
        run: bash repo-ops/ci-diagnostic/native-environment-evidence.sh after
      - run: bun install --frozen-lockfile
      - name: Verify native TypeScript 7 and legacy compiler API coexist
        run: |
          test "$(bun x --no-install tsc --version)" = 'Version 7.0.2'
          node -e 'const ts = require("typescript"); if (typeof ts.readConfigFile !== "function" || typeof ts.createProgram !== "function") throw new Error("TypeScript compatibility API unavailable")'
      - name: Fingerprint native dependency environment
        if: (github.event_name == 'pull_request' && github.base_ref == 'develop') || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        id: native-cache-key
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"
            rustc -vV
            cargo -V
            cc --version
            ld --version
            pkg-config --version
            dpkg-query -W -f='${binary:Package}\t${Version}\n' | LC_ALL=C sort
            sha256sum product/apps/osu-skin-workbench/src-tauri/Cargo.toml product/apps/osu-skin-workbench/src-tauri/Cargo.lock
          } > "$RUNNER_TEMP/native-cache-inputs.txt"
          hash="$(sha256sum "$RUNNER_TEMP/native-cache-inputs.txt" | cut -d ' ' -f 1)"
          printf 'digest=%s\n' "$hash" >> "$GITHUB_OUTPUT"
          printf 'Native dependency environment: %s\n' "$hash"
      - name: Restore Rust dependency artifacts
        if: steps.native-cache-key.outcome == 'success'
        id: native-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: tenzyudotcom-native-deps-v1
          key: ${{ steps.native-cache-key.outputs.digest }}
          add-job-id-key: false
          workspaces: product/apps/osu-skin-workbench/src-tauri -> target
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: false
      - name: Enforce fresh workspace compilation
        if: steps.native-cache-key.outcome == 'success'
        env:
          CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          target=product/apps/osu-skin-workbench/src-tauri/target
          # Never consume compiled artifacts from a prefix-only restore.
          if [[ "$CACHE_HIT" != true ]]; then
            rm -rf -- "$target"
          fi
          if [[ -d "$target" ]]; then
            stale="$(find "$target" \( -name 'osu-skin-workbench*' -o -name 'osu_skin_workbench*' -o -name 'libosu_skin_workbench*' -o -name 'wire.generated.ts' \) -print -quit)"
            if [[ -n "$stale" ]]; then
              printf 'Unexpected cached workspace output: %s\n' "$stale" >&2
              exit 1
            fi
          fi
      - name: Generate IPC contract and verify TypeScript projection
        run: |
          mkdir -p product/apps/osu-skin-workbench/src-tauri/target
          SKIN_IPC_EXPORT="$PWD/product/apps/osu-skin-workbench/src-tauri/target/wire.generated.ts" cargo test --locked --manifest-path product/apps/osu-skin-workbench/src-tauri/Cargo.toml export_wire_contract
          bun nx run osu-skin-core:build
          bun x tsc --ignoreConfig --noEmit --strict --skipLibCheck --moduleResolution bundler --module esnext --target es2022 product/apps/osu-skin-workbench/scripts/wire-contract-check.ts
      - name: Verify native product and build its distributable
        run: bun nx run-many -t verify build --projects=skin-workbench --skip-nx-cache
      - name: Record native WebKit driver version
        run: |
          command -v WebKitWebDriver
          dpkg-query -W webkit2gtk-driver libwebkit2gtk-4.1-0
      - name: Verify native WebView and real IPC with isolated skin data
        run: xvfb-run -a dbus-run-session -- python3 product/apps/osu-skin-workbench/tests/tauri-runtime.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-environment-${{ matrix.mode }}-${{ matrix.repeat }}
          path: |
            ${{ runner.temp }}/environment-evidence/
            ${{ runner.temp }}/native-cache-inputs.txt
          if-no-files-found: error
          retention-days: 7

  integration-replay:
    if: github.head_ref == 'diagnostic/native-environment-cohort-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash repo-ops/ci-diagnostic/historical-integration-replay.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-integration-replay
          path: ${{ runner.temp }}/integration-replay/
          if-no-files-found: error
          retention-days: 7
