name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency policy
        run: bun run policy:deps

      - name: Workspace boundary policy
        run: bun run verify:workspace

      - name: Affected checks
        run: bun nx affected -t check --base=origin/main --head=HEAD

      - name: Affected builds
        run: bun nx affected -t build --base=origin/main --head=HEAD

      - name: Workbench Rust checks
        run: |
          bun nx run skin-workbench:cargo-check
          bun nx run skin-workbench:cargo-clippy

      - name: Full verification on main
        if: github.ref == 'refs/heads/main'
        run: bun nx run-many -t verify
