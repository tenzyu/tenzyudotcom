notes: |
  Round 3 control repair. The orchestrator's `required_before` machinery
  already enforces the re-run cadence for VG-001, VG-036, VG-037, and
  VG-038. This packet makes the cadence explicit in a single,
  self-contained section so a fresh mother-agent session can read the
  re-run contract without reverse-engineering the gate table. No gate
  value was modified: VG-001 still says "Every packet acceptance and
  final completion"; VG-036 still says "DAG-01, every phase gate, final
  completion"; VG-037 still says "Before ordinary packet acceptance and
  every phase gate"; VG-038 still says "Every packet that touches tests,
  fixtures, serializers, validators, or public surfaces". The new
  section cites those `required_before` values and maps them to the
  operational triggers (packet acceptance, phase-gate claim, final
  completion, control-doc edit, test-touching diff). The stale-history
  P1 finding is documented because the existing `Validation History`
  table has no formal rule preventing drift between accepted packets
  and recorded validation entries.
