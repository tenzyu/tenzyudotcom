mission: |
  Add a new "Validation Re-run Cadence" section to
  `harness/knowledge/implementation-control/atelier/IMPLEMENTATION_ORCHESTRATOR.md`
  that makes explicit the re-run cadence for the four critical control
  gates VG-001 (no product-spec edits), VG-036 (product-spec hash
  baseline), VG-037 (immutable control-doc diff check), and VG-038
  (test-integrity / no weakening). The orchestrator's `required_before`
  machinery already encodes these cadences, but no single section
  summarizes them. The section also documents that a stale `Validation
  History` (a packet accepted without a matching validation entry) is
  itself a P1 finding. This is documentation only; no gate
  `required_before` value is changed, no gate is weakened, no
  completion criterion is broadened, and product-spec immutability is
  preserved.
