mission: |
  Add a new validation gate VG-046 (parallel-packet conflict detection)
  plus its associated implementation, orchestrator description, and
  packet schema field. This is the gate that mechanically prevents two
  in-flight implementation packets from mutating overlapping files,
  fixtures, schemas, command surfaces, or generated-state paths.
  Specifically:

  1. Add the VG-046 record to
     state/gates/structured-gates-2026-06-04.yaml with
     executable_now: true, P1 blocking severity, and the new
     parallel_conflict_check_v1 fixture_id.

  2. Add the VG-046 section to VALIDATION_GATE_REGISTRY.md matching
     the structure of the other gate sections (Purpose, Command,
     Severity, Executable Now, Required Before, Notes).

  3. Implement the check at
     product/apps/atelier/src/core/parallel-conflict-checker.ts and
     the test at
     product/apps/atelier/src/__tests__/parallel-conflict-checker.test.ts.
     The script reads
     state/packets/in-flight.yaml (or the ledger's In-flight Packets
     section; be consistent), takes a hypothetical candidate packet's
     allowed_files and forbidden_roots, intersects them against each
     in-flight packet's allowed_files and forbidden_roots, detects
     fixture family / command surface / generated-state /
     durable-evidence overlap, and returns passed or failed with
     details.

  4. Add a Conflict-Detection Algorithm section to
     IMPLEMENTATION_ORCHESTRATOR.md describing the in-flight list
     source, the pre-dispatch VG-046 invocation, the failed-dispatch
     handling (wait or BLK-CONFLICT-<id>), and the new
     allowed_files_intersect_inflight packet field.

  5. Add the allowed_files_intersect_inflight field to the packet
     schema in AGENT_PACKET_PROTOCOL.md with the closed list type
     and the empty default.

  6. Add rows to the Packet Status table and Validation History
     table for at-ctrl-009 and VG-046 in IMPLEMENTATION_LEDGER.md,
     plus a new In-flight Packets section (machine-readable YAML
     mirror; initial state empty list).

  7. Create the machine-readable in-flight file at
     state/packets/in-flight.yaml with schema header and empty list.

  8. Create the packet record (this file), the acceptance proof at
     state/validations/at-ctrl-009-acceptance-2026-06-04.md, and the
     VG-046 proof at state/validations/VG-046-2026-06-04.md.

  No product specs are edited. No existing gate is weakened. No
  forbidden action is performed.
