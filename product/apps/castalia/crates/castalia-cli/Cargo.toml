[package]
name = "castalia"
description = "Local-first prompt and skill launcher for Linux"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "castalia"
path = "src/main.rs"

[dependencies]
castalia-core = { path = "../castalia-core" }
eframe = { version = "0.34.3", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
