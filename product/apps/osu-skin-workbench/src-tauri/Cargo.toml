[package]
name = "osu-skin-workbench"
version = "0.1.0"
description = "osu! Skin Workbench"
authors = ["tenzyu"]
edition = "2021"

[lib]
name = "osu_skin_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
osu-skin-workbench-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["core"]
default-members = [".", "core"]
resolver = "2"
