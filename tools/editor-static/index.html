<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>osu! Skin Editor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brandHeader">
            <h1>osu! Skin Editor</h1>
            <button id="toggleSidebar" title="Collapse sidebar" aria-label="Collapse sidebar">‹</button>
          </div>
          <p id="workspace">Loading workspace...</p>
        </div>

        <section>
          <h2>Main Skin</h2>
          <label>
            Project name
            <input id="projectName" placeholder="optional" />
          </label>
          <label>
            Path
            <input id="mainPath" placeholder="choose a .osk or folder" />
          </label>
          <div class="buttonRow">
            <button id="chooseMainFile">Choose .osk</button>
            <button id="chooseMainFolder">Choose folder</button>
          </div>
          <button id="importMain" class="primary">Import main skin</button>
          <button id="importBackup">Import backup</button>
        </section>

        <section>
          <h2>Projects</h2>
          <select id="projectSelect"></select>
          <button id="refreshProjects">Refresh</button>
        </section>

        <section>
          <h2>Asset Skin</h2>
          <label>
            Name
            <input id="assetName" placeholder="optional" />
          </label>
          <label>
            Path
            <input id="assetPath" placeholder="choose a .osk or folder" />
          </label>
          <div class="buttonRow">
            <button id="chooseAssetFile">Choose .osk</button>
            <button id="chooseAssetFolder">Choose folder</button>
          </div>
          <button id="importAsset">Add asset source</button>
        </section>

        <section>
          <h2>Asset Sources</h2>
          <div id="sourceList" class="sourceList"></div>
        </section>
      </aside>

      <main class="main">
        <header class="toolbar">
          <button id="showSidebar" class="sidebarOpen" title="Show sidebar" aria-label="Show sidebar">☰</button>
          <div>
            <h2 id="projectTitle">No project loaded</h2>
            <p id="projectMeta"></p>
          </div>
          <div class="toolbarActions">
            <div class="viewSwitch" role="tablist" aria-label="View mode">
              <button id="editView" class="active" type="button">Edit</button>
              <button id="previewView" type="button">Preview</button>
            </div>
            <select id="sourceSelect"></select>
            <button id="undoProject">Undo</button>
            <button id="historyProject">History</button>
            <button id="reclassifyProject">Reclassify</button>
            <button id="exportProject" class="primary">Export</button>
          </div>
        </header>

        <nav id="scopeTabs" class="tabs"></nav>
        <nav id="categoryTabs" class="tabs subTabs"></nav>

        <section id="editShell" class="compareShell">
          <div class="compareTools">
            <input id="assetFilter" placeholder="Filter assets" />
            <label class="inlineControl"><input id="meaningfulOnly" type="checkbox" checked /> Lazer meaningful only</label>
            <label class="inlineControl"><input id="collapseStable" type="checkbox" checked /> Collapse stable later</label>
            <select id="sourceFilterMode">
              <option value="all">All rows</option>
              <option value="missing">Missing in project</option>
              <option value="different">Different from project</option>
              <option value="warnings">Warnings</option>
              <option value="hd">Has HD</option>
              <option value="sd">Has SD</option>
            </select>
            <select id="densityMode">
              <option value="comfortable">Comfortable</option>
              <option value="compact">Compact</option>
            </select>
            <button id="selectVisible">Select visible</button>
            <button id="selectMissing">Select missing</button>
            <button id="selectWarnings">Select warnings</button>
            <button id="clearSelection">Clear selection</button>
            <button id="clearCategory">Clear category</button>
            <button id="copySelected">Copy selected</button>
          </div>
          <div id="validationSummary" class="validationSummary"></div>
          <div class="compareHeader">
            <div>
              <h3>Project</h3>
              <p id="projectColumnMeta" class="muted"></p>
            </div>
            <div>
              <h3>Asset Source</h3>
              <p id="assetColumnMeta" class="muted"></p>
            </div>
          </div>
          <p id="compareMeta" class="muted"></p>
          <div id="assetRows" class="assetRows"></div>
          <div id="projectAssets" class="hidden"></div>
          <div id="sourceAssets" class="hidden"></div>
        </section>

        <section id="previewShell" class="previewShell hidden">
          <div class="previewTabs" id="previewTabs"></div>
          <div id="previewStage" class="previewStage"></div>
        </section>
      </main>
    </div>

    <div id="reclassifyOverlay" class="overlay hidden">
      <div class="modal">
        <header>
          <h2>Reclassify Project</h2>
          <button id="closeReclassify">Close</button>
        </header>
        <div id="reclassifyPreview" class="modalList"></div>
        <footer>
          <button id="runReclassify" class="primary">Apply reclassify</button>
        </footer>
      </div>
    </div>

    <div id="validationOverlay" class="overlay hidden">
      <div class="modal">
        <header>
          <h2>Warnings</h2>
          <button id="closeValidation">Close</button>
        </header>
        <div id="validationList" class="modalList"></div>
        <footer>
          <button id="closeValidationFooter">Close</button>
        </footer>
      </div>
    </div>

    <div id="historyOverlay" class="overlay hidden">
      <div class="modal">
        <header>
          <h2>Undo History</h2>
          <button id="closeHistory">Close</button>
        </header>
        <div id="historyList" class="modalList"></div>
        <footer>
          <button id="closeHistoryFooter">Close</button>
        </footer>
      </div>
    </div>

    <div id="textOverlay" class="overlay hidden">
      <div class="modal textModal">
        <header>
          <h2 id="textTitle">Edit text</h2>
          <button id="closeText">Close</button>
        </header>
        <div id="textForm" class="textForm"></div>
        <textarea id="textEditor"></textarea>
        <footer>
          <button id="saveText" class="primary">Save</button>
        </footer>
      </div>
    </div>

    <div id="conflictOverlay" class="overlay hidden">
      <div class="modal">
        <header>
          <h2>Apply Changes</h2>
          <button id="closeConflicts">Close</button>
        </header>
        <div id="conflictList"></div>
        <footer>
          <button id="applyConflicts" class="primary">Apply choices</button>
        </footer>
      </div>
    </div>

    <div id="exportOverlay" class="overlay hidden">
      <div class="modal exportModal">
        <header>
          <h2>Export</h2>
          <button id="closeExport">Close</button>
        </header>
        <div class="exportBody">
          <label>
            Preset
            <select id="exportPreset">
              <option value="full">Full</option>
              <option value="sd">SD only</option>
              <option value="hd">HD only</option>
              <option value="diff">Diff</option>
              <option value="backup">Backup</option>
            </select>
          </label>
          <p id="exportPresetDescription" class="muted"></p>
          <div class="formGrid">
            <label class="inlineControl"><input id="formatFlat" type="checkbox" checked /> Flat folder</label>
            <label class="inlineControl"><input id="formatOsk" type="checkbox" checked /> .osk</label>
            <label class="inlineControl"><input id="formatDiff" type="checkbox" /> Diff folder</label>
            <label class="inlineControl"><input id="formatBackup" type="checkbox" /> Project backup</label>
            <label class="inlineControl"><input id="includeStable" type="checkbox" checked /> Include stable later</label>
            <label class="inlineControl"><input id="includeExtras" type="checkbox" checked /> Include extras</label>
          </div>
          <div id="validationPanel" class="validationPanel"></div>
          <div id="exportResult" class="exportResult hidden"></div>
        </div>
        <footer>
          <button id="runExport" class="primary">Export</button>
        </footer>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
